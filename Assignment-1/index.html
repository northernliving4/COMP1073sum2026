<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>See 'N' Say Storymaker</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div class="toy-frame">

    <h1 class="toy-title">&#10022; See 'N' Say Storymaker &#10022;</h1>

    <div class="toy-body">

      <div class="left-panel">
        <div class="columns-wrapper" id="columnsWrapper"></div>
        <div class="preview-row" id="previewRow"></div>
      </div>

      <div class="right-panel">

        <div class="color-dots">
          <div class="dot" style="background:#ef4444;"></div>
          <div class="dot" style="background:#22c55e;"></div>
          <div class="dot" style="background:#3b82f6;"></div>
          <div class="dot" style="background:#f97316;"></div>
          <div class="dot" style="background:#ec4899;"></div>
        </div>

        <div class="mascot-area">
          <div class="mascot-emoji">&#128027;</div>
          <div class="mascot-label">Wormy</div>
        </div>

        <div class="action-btns">
          <button class="btn-action btn-tell"   onclick="tellStory()">&#128214; Tell My Story!</button>
          <button class="btn-action btn-random" onclick="randomStory()">&#127922; Random Story</button>
          <button class="btn-action btn-reset"  onclick="resetAll()">&#8635; Reset</button>
        </div>

      </div>
    </div>

    <div class="story-output">
      <span id="storyDisplay" class="story-placeholder">
        Click each column to pick your words, then press &ldquo;Tell My Story!&rdquo;
      </span>
    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
